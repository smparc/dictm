[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "dictm"
version = "2.0.0"
description = "Supreme Court Case Outcome Prediction using Bayesian Networks"
readme = "README.md"
# The codebase uses PEP 604 unions (`int | None`) and builtin generics in
# annotations, both of which require 3.10.
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    # scipy arrives transitively with scikit-learn, but structure_learning.g_test
    # imports it directly, so it is declared rather than assumed.
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
notebook = [
    "jupyter>=1.0",
]


[project.scripts]
dictm = "main:main"
dictm-serve = "app.server:run"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]


[tool.setuptools.packages.find]
include = ["src*", "app*"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function calls in argument defaults (FastAPI idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]   # pytest fixtures look like unused imports/redefinitions
"src/__init__.py" = ["F401"]   # re-exports
