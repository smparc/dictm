name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the codebase uses PEP 604 unions in annotations.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"

      - name: Lint
        run: ruff check src app tests main.py scripts

      - name: Test
        # The suite runs entirely on synthetic fixtures, so it needs no SCDB
        # download and stays fast enough to gate every push.
        run: pytest --cov=src --cov=app --cov-report=term-missing --cov-fail-under=75

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the package builds and installs
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          python -c "import src; print('dictm', src.__version__)"
